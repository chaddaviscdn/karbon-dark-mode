<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 244px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #141414;
      color: #f5f5f5;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    .moon { font-size: 16px; }
    /* toggle switch */
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex: none;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #4b4b4b;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.15s ease;
    }
    input:checked + .slider { background: #2b6ed5; }
    input:checked + .slider::before { transform: translateX(18px); }
    .hint {
      padding: 0 16px 8px;
      font-size: 11px;
      color: #9a9a9a;
      line-height: 1.4;
    }
    .credit {
      padding: 0 16px 12px;
      font-size: 9px;
      color: #6a6a6a;
      line-height: 1.4;
    }
    .credit a {
      color: #6a6a6a;
      text-decoration: none;
    }
    .credit a:hover { color: #9a9a9a; }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-top: 1px solid #262626;
      font-size: 10px;
    }
    .meta a {
      color: #8a8a8a;
      text-decoration: none;
    }
    .meta a:hover { color: #cfcfcf; }
  </style>
</head>
<body>
  <div class="row">
    <span class="title"><span class="moon">&#127769;</span> Karbon Dark Mode</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="hint" id="hint">Applies to app2.karbonhq.com</div>
  <div class="credit">brought to you by <a href="https://automationtown.io" target="_blank" rel="noopener">automationtown.io</a></div>
  <div class="meta">
    <a id="version" href="https://github.com/chaddaviscdn/karbon-dark-mode/releases" target="_blank" rel="noopener" title="Check for a newer version">v0.0.0</a>
    <a href="https://github.com/chaddaviscdn/karbon-dark-mode" target="_blank" rel="noopener">GitHub &#8599;</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
